<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Nákupy</title>
    <style>
        :root { --bg: #e0e5ec; --text: #1a1a1a; --primary: #ffa502; --accent: #2ed573; --danger: #ff4757; --border: 4px solid #000; }
        body { font-family: 'Courier New', Courier, monospace; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; font-weight: bold; }
        h1, h2, h3 { text-transform: uppercase; margin-top: 0; }
        h1 { border-bottom: var(--border); padding-bottom: 8px; font-size: 1.4rem; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .card { background: #fff; border: var(--border); padding: 15px; margin-bottom: 20px; box-shadow: 6px 6px 0px #000; }
        .card.history { background: #dcdde1; color: #555; border: 4px solid #555; box-shadow: 6px 6px 0px #555; }
        
        input, select { width: 100%; padding: 10px; border: var(--border); box-sizing: border-box; font-family: inherit; font-weight: bold; margin-bottom: 15px; font-size: 1rem; background: #fff; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        
        button { background-color: var(--primary); color: #000; border: var(--border); padding: 10px 15px; font-size: 1.1rem; cursor: pointer; font-weight: bold; text-transform: uppercase; box-shadow: 4px 4px 0px #000; transition: all 0.1s; width: 100%; margin-bottom: 5px; }
        button:active { box-shadow: 0px 0px 0px #000; transform: translate(4px, 4px); }
        button.action { background-color: var(--accent); color: #000; }
        button.small { font-size: 0.9rem; padding: 6px 10px; box-shadow: 2px 2px 0px #000; width: auto; }
        button.small:active { transform: translate(2px, 2px); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th, td { border: var(--border); padding: 8px; text-align: left; }
        th { background: #000; color: #fff; font-size: 0.85rem; }

        .list-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #000; padding: 10px 0; }
        .list-item:last-child { border-bottom: none; }
        .item-info { flex: 1; }
        .item-title { font-size: 1.1rem; }
        .item-meta { font-size: 0.8rem; color: #555; }
        .item-action { display: flex; gap: 5px; }
        
        .separator { border-top: 4px solid #000; margin: 40px 0 20px 0; }
        .loading { text-align: center; color: #576574; font-size: 1.1rem; margin-bottom: 15px; }
        .flex-row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="display: inline-block; margin-bottom: 15px; color: #000; text-decoration: none; border-bottom: 2px solid #000; font-size: 1.1rem;">⬅ Zpět na základnu</a>
    
    <h1>🛒 Co koupit</h1>
    <div id="status-zpravy" class="loading">Načítám nákupy... ⏳</div>

    <!-- Síň sponzorů -->
    <div class="card">
        <h2>💰 Celkové útraty bytu</h2>
        <table>
            <thead><tr><th>Sponzor</th><th>Utratil celkem</th></tr></thead>
            <tbody id="utraty-body"></tbody>
        </table>
    </div>

    <!-- Seznam co koupit -->
    <div class="card">
        <h2>📝 Chybí v bytu</h2>
        
        <!-- Tento blok se návštěvě schová -->
        <div id="guest-hide-1" class="flex-row">
            <input type="text" id="nova-polozka" placeholder="Co chybí? (např. Toaleťák)" style="margin-bottom:0;">
            <button class="action small" style="margin-bottom:0;" onclick="pridatNaSeznam()">Přidat</button>
        </div>
        
        <div id="seznam-koupit" style="margin-top: 15px;"></div>
    </div>

    <!-- Nákup mimo seznam (Tento celý blok se návštěvě schová) -->
    <div id="guest-hide-2" class="card">
        <h2>🛍️ Koupil jsem mimo seznam</h2>
        <label>Co to bylo?</label>
        <input type="text" id="mimo-polozka" placeholder="Např. Jar na nádobí...">
        <label>Cena (Kč)</label>
        <input type="number" id="mimo-cena" placeholder="59">
        <button class="action" onclick="koupitMimoSeznam()">Zapsat útratu</button>
    </div>
    
    <div class="separator"></div>
    <h2>📜 Historie nákupů</h2>
    <div id="seznam-historie"></div>
</div>

<script>
    // ZDE VLOŽ SVOU NOVOU URL ADRESU Z GOOGLU!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHqrROp3-eezWmTDnA_LRRHYDnr-Eisr-859fV9J7GMXpHMC4y8Kec-4qbJzftguLa/exec"; 
    
    const loggedInUser = localStorage.getItem('squad_user');
    if (!loggedInUser) window.location.href = "index.html";

    // Zjištění, zda je přihlášený uživatel návštěva
    const isGuest = loggedInUser.startsWith("Návštěva:");

    async function loadData() {
        // Pokud je to návštěva, skryjeme formuláře pro přidávání a nákup
        if (isGuest) {
            document.getElementById("guest-hide-1").style.display = "none";
            document.getElementById("guest-hide-2").style.display = "none";
        }

        try {
            const response = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
            const data = await response.json();
            
            // 1. Útraty
            const tbodyUtraty = document.getElementById("utraty-body");
            tbodyUtraty.innerHTML = "";
            let lide = ["Hetik", "Fajt", "Simon", "TobySS"];
            let serazeneUtraty = lide.map(j => ({ jmeno: j, castka: data.utraty[j] || 0 })).sort((a, b) => b.castka - a.castka);
            serazeneUtraty.forEach((osoba, index) => {
                let ikona = (index === 0 && osoba.castka > 0) ? " 👑" : "";
                tbodyUtraty.innerHTML += `<tr><td>${osoba.jmeno}${ikona}</td><td><b>${osoba.castka} Kč</b></td></tr>`;
            });

            // 2. Seznam k nákupu
            const seznamKoupit = document.getElementById("seznam-koupit");
            seznamKoupit.innerHTML = "";
            if(data.nakupyToBuy && data.nakupyToBuy.length > 0) {
                data.nakupyToBuy.forEach(n => {
                    // Tlačítko pro odškrtnutí vygenerujeme jen tehdy, pokud to NENÍ návštěva
                    let actionBtn = isGuest ? "" : `<button class="action small" onclick="koupilJsemZeSeznamu('${n.id}', '${n.polozka}')">✔️ Koupil jsem</button>`;
                    
                    seznamKoupit.innerHTML += `
                        <div class="list-item">
                            <div class="item-info">
                                <div class="item-title">${n.polozka}</div>
                                <div class="item-meta">Přidal: ${n.pridal}</div>
                            </div>
                            <div class="item-action">
                                ${actionBtn}
                            </div>
                        </div>
                    `;
                });
            } else {
                seznamKoupit.innerHTML = "<p style='font-style:italic; color:#555;'>Všechno máme! Byt je zásoben.</p>";
            }

            // 3. Historie
            const seznamHistorie = document.getElementById("seznam-historie");
            seznamHistorie.innerHTML = "";
            if(data.nakupyHistory && data.nakupyHistory.length > 0) {
                data.nakupyHistory.forEach(n => {
                    seznamHistorie.innerHTML += `
                        <div class="card history" style="padding: 10px; margin-bottom: 10px;">
                            <div style="display:flex; justify-content:space-between;">
                                <b>${n.polozka}</b>
                                <span style="color:var(--danger);"><b>${n.cena} Kč</b></span>
                            </div>
                            <div style="font-size:0.8rem; margin-top:5px;">Koupil: <b>${n.koupil}</b></div>
                        </div>
                    `;
                });
            } else {
                seznamHistorie.innerHTML = "<p style='font-style:italic;'>Historie je prázdná.</p>";
            }

            document.getElementById("status-zpravy").style.display = "none";
        } catch (error) {
            document.getElementById("status-zpravy").innerText = "❌ Nepodařilo se načíst data.";
        }
    }

    async function pridatNaSeznam() {
        if (isGuest) return; // Pojistka
        const polozka = document.getElementById("nova-polozka").value;
        if (!polozka) return;
        
        document.getElementById("nova-polozka").value = "⏳ Přidávám...";
        try {
            await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "add_nakup", polozka: polozka, vytvoril: loggedInUser }) });
            location.reload(); 
        } catch (e) { alert("Chyba!"); }
    }

    async function koupilJsemZeSeznamu(id, nazevPolozky) {
        if (isGuest) return; // Pojistka
        let cena = prompt(`Kolik tě stál(a) ${nazevPolozky}?\nZadej částku v Kč:`);
        if (cena === null) return;
        cena = parseInt(cena);
        if (isNaN(cena) || cena <= 0) return alert("Musíš zadat platnou částku v číslech!");

        try {
            await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "buy_nakup", id: id, koupil: loggedInUser, cena: cena }) });
            location.reload(); 
        } catch (e) { alert("Chyba!"); }
    }

    async function koupitMimoSeznam() {
        if (isGuest) return; // Pojistka
        const polozka = document.getElementById("mimo-polozka").value;
        const cena = parseInt(document.getElementById("mimo-cena").value);
        
        if (!polozka || isNaN(cena) || cena <= 0) return alert("Vyplň název a platnou částku!");

        document.getElementById("mimo-polozka").value = "⏳ Zapisuji...";
        try {
            await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "direct_nakup", polozka: polozka, cena: cena, vytvoril: loggedInUser }) });
            location.reload(); 
        } catch (e) { alert("Chyba!"); }
    }

    document.addEventListener("DOMContentLoaded", loadData);
</script>
</body>
</html>
