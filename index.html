<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Base</title>
    <style>
        :root { 
            --bg: #e0e5ec; 
            --text: #000; 
            --border: 6px solid #000; 
            --c-uklid: #2ed573;
            --c-nakupy: #ffa502;
            --c-akce: #1e90ff;
            --c-ankety: #9b59b6;
            --c-pravidla: #ff4757;
            --danger: #ff4757;
        }
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            font-weight: bold; 
        }
        
        .top-bar { text-align: center; font-size: 1.1rem; margin-bottom: 15px; }
        .top-bar span { color: var(--c-akce); }
        .top-bar a { color: var(--c-pravidla); text-decoration: underline; cursor: pointer; }
        
        h1 { text-align: center; text-transform: uppercase; border-bottom: 8px solid #000; padding-bottom: 20px; margin-top: 0; margin-bottom: 30px; font-size: 2.2rem; }
        
        .container { max-width: 800px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .tile { 
            border: var(--border); padding: 30px 10px; text-align: center; text-decoration: none; color: #000; box-shadow: 8px 8px 0px #000; transition: transform 0.1s, box-shadow 0.1s; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .tile:active { transform: translate(4px, 4px); box-shadow: 4px 4px 0px #000; }
        
        .tile.uklid { background-color: var(--c-uklid); }
        .tile.nakupy { background-color: var(--c-nakupy); }
        .tile.akce { background-color: var(--c-akce); color: #fff; }
        .tile.ankety { background-color: var(--c-ankety); color: #fff; }
        .tile.pravidla { background-color: var(--c-pravidla); color: #fff; grid-column: 1 / -1; } 
        
        .tile-icon { font-size: 4rem; margin-bottom: 15px; }
        .tile-title { font-size: 1.2rem; text-transform: uppercase; margin-bottom: 15px; }
        
        .status-badge { background: #000; color: #fff; display: inline-block; padding: 5px 20px; border-radius: 20px; font-size: 0.9rem; text-transform: uppercase; }
        
        .badge-notification {
            position: absolute; top: -15px; right: -15px; background-color: var(--danger); color: #fff; border: 4px solid #000; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; box-shadow: 4px 4px 0px #000; z-index: 10; display: none; 
        }

        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: #fff; border: var(--border); padding: 30px; box-shadow: 8px 8px 0px #000; text-align: center; width: 80%; max-width: 300px; }
        
        select, input, button { width: 100%; padding: 12px; margin-top: 15px; border: 4px solid #000; box-sizing: border-box; font-family: inherit; font-weight: bold; font-size: 1.1rem; }
        input { background: #f1f2f6; }
        button { background: var(--c-akce); color: #fff; cursor: pointer; text-transform: uppercase; box-shadow: 4px 4px 0px #000; transition: transform 0.1s, box-shadow 0.1s; }
        button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }

        /* Loader schováme, aby neblikal, jen ho necháme jako malý text nahoře pro info */
        .loader { text-align: center; margin-bottom: 20px; font-size: 0.9rem; color: #555; height: 20px; opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>IDENTIFIKACE</h2>
        <select id="user-select" onchange="toggleGuestInput()">
            <option value="Hetik">Hetik</option>
            <option value="Fajt">Fajt</option>
            <option value="Simon">Simon</option>
            <option value="TobySS">TobySS</option>
            <option value="guest">👽 Návštěvník</option>
        </select>
        <input type="text" id="guest-name" placeholder="Tvoje jméno..." style="display: none;">
        <button onclick="login()">Vstoupit</button>
    </div>
</div>

<div class="container" id="main-content" style="display: none;">
    <div class="top-bar">
        Přihlášen jako: <span id="current-user"></span> | <a onclick="logout()">Odhlásit</a>
    </div>

    <h1>⚠️ SQUAD BASE (BETA)</h1>
    
    <div id="loader" class="loader">Aktualizuji data... 🔄</div>
    
    <div class="grid">
        <a href="uklid.html" class="tile uklid">
            <div id="badge-uklid" class="badge-notification"></div>
            <div class="tile-icon">🧹</div>
            <div class="tile-title">Bordel & Úklid</div>
            <div class="status-badge">Aktivní</div>
        </a>
        
        <a href="nakupy.html" class="tile nakupy">
            <div id="badge-nakupy" class="badge-notification"></div>
            <div class="tile-icon">🛒</div>
            <div class="tile-title">Co koupit</div>
            <div class="status-badge">Aktivní</div>
        </a>
        
        <a href="akce.html" class="tile akce">
            <div id="badge-akce" class="badge-notification"></div>
            <div class="tile-icon">🍻</div>
            <div class="tile-title">Plány & Akce</div>
            <div class="status-badge">Aktivní</div>
        </a>

        <a href="ankety.html" class="tile ankety">
            <div id="badge-ankety" class="badge-notification"></div>
            <div class="tile-icon">📊</div>
            <div class="tile-title">Ankety & Hlasování</div>
            <div class="status-badge">Aktivní</div>
        </a>

        <a href="pravidla.html" class="tile pravidla">
            <div class="tile-icon">📜</div>
            <div class="tile-title">Pravidla bytu</div>
            <div class="status-badge">Info</div>
        </a>
    </div>
</div>

<script>
    // ZDE VLOŽ SVOU GOOGLE APPS SCRIPT URL!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHqrROp3-eezWmTDnA_LRRHYDnr-Eisr-859fV9J7GMXpHMC4y8Kec-4qbJzftguLa/exec"; 

    function toggleGuestInput() {
        const select = document.getElementById('user-select');
        const guestInput = document.getElementById('guest-name');
        if (select.value === 'guest') {
            guestInput.style.display = 'block';
            guestInput.focus();
        } else {
            guestInput.style.display = 'none';
        }
    }

    function checkLogin() {
        const user = localStorage.getItem('squad_user');
        if (user) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('current-user').innerText = user;
            loadNotifications(user); 
        }
    }

    function login() {
        let user = document.getElementById('user-select').value;
        if (user === 'guest') {
            const guestName = document.getElementById('guest-name').value.trim();
            if (!guestName) return alert("Musíš zadat své jméno!");
            user = "Návštěva: " + guestName;
        }
        localStorage.setItem('squad_user', user);
        checkLogin();
    }

    function logout() {
        localStorage.removeItem('squad_user');
        location.reload();
    }

    async function loadNotifications(user) {
        const isGuest = user.startsWith("Návštěva:");
        const loader = document.getElementById("loader");

        // 1. Zkusíme načíst data z paměti telefonu pro BLESKOVÉ zobrazení
        const cachedData = localStorage.getItem('squad_notifs');
        if (cachedData) {
            zpracujData(JSON.parse(cachedData), user, isGuest);
        } else {
            // Nemáme nic v paměti, ukážeme loader
            loader.style.opacity = "1";
        }

        // 2. Na pozadí se potichu zeptáme Googlu na aktuální data
        loader.style.opacity = "1";
        try {
            const response = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
            const data = await response.json();

            // Uložíme do paměti pro příště a hned aktualizujeme odznáčky
            localStorage.setItem('squad_notifs', JSON.stringify(data));
            zpracujData(data, user, isGuest);
        } catch (error) {
            console.error("Chyba synchronizace s databází.");
        } finally {
            loader.style.opacity = "0";
        }
    }

    function zpracujData(data, user, isGuest) {
        let mujUklid = 0;
        if (!isGuest) {
            if (data.rozpis) mujUklid += data.rozpis.filter(r => r.jmeno === user && !r.hotovo).length;
            if (data.aktivniBordel) mujUklid += data.aktivniBordel.filter(b => b.kdo === user).length;
        }
        nastavOdznacek('badge-uklid', mujUklid);

        let nakupyCount = 0;
        if (!isGuest && data.nakupyToBuy) {
            nakupyCount = data.nakupyToBuy.length;
        }
        nastavOdznacek('badge-nakupy', nakupyCount);

        let akceCount = 0;
        if (data.akce) akceCount = data.akce.filter(a => a.stav === "Aktivní" && !a.ucastnici.includes(user)).length;
        nastavOdznacek('badge-akce', akceCount);

        let anketyCount = 0;
        if (data.ankety) anketyCount = data.ankety.filter(a => a.stav === "Aktivní" && (!a.hlasy || !a.hlasy[user])).length;
        nastavOdznacek('badge-ankety', anketyCount);
    }

    function nastavOdznacek(idElementu, pocet) {
        const badge = document.getElementById(idElementu);
        if (badge) {
            if (pocet > 0) { badge.innerText = pocet; badge.style.display = 'flex'; } 
            else { badge.style.display = 'none'; }
        }
    }

    document.addEventListener("DOMContentLoaded", checkLogin);
</script>
</body>
</html>
