<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Base</title>
    <style>
        :root { --bg: #e0e5ec; --text: #1a1a1a; --border: 4px solid #000; --red: #ff4757; --green: #2ed573; --yellow: #ffa502; --blue: #1e90ff; }
        body { font-family: 'Courier New', Courier, monospace; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; font-weight: bold; }
        h1 { text-transform: uppercase; border-bottom: var(--border); padding-bottom: 8px; margin-top: 10px; font-size: 2rem; text-align: center; }
        .container { max-width: 600px; margin: 20px auto; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 30px; }
        @media (min-width: 450px) { .grid { grid-template-columns: 1fr 1fr; } }
        
        .tile { 
            background: #fff; 
            border: var(--border); 
            padding: 30px 15px; 
            text-align: center; 
            text-decoration: none; 
            color: #000; 
            box-shadow: 6px 6px 0px #000; 
            transition: all 0.1s; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
        }
        .tile:active { box-shadow: 0px 0px 0px #000; transform: translate(6px, 6px); }
        
        .tile.uklid { background-color: var(--green); }
        .tile.nakupy { background-color: var(--yellow); }
        .tile.akce { background-color: var(--blue); color: #fff; }
        .tile.info { background-color: var(--red); color: #fff; }
        
        .tile-icon { font-size: 3.5rem; }
        .tile-title { font-size: 1.3rem; text-transform: uppercase; }
        .status-badge { font-size: 0.8rem; background: #000; color: #fff; padding: 4px 8px; border-radius: 12px; margin-top: -5px;}
        
        /* Styly pro přihlašování */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
        .login-btn { background: #fff; border: var(--border); padding: 15px; font-size: 1.5rem; font-family: inherit; font-weight: bold; cursor: pointer; box-shadow: 6px 6px 0px #000; margin-bottom: 15px; text-transform: uppercase; transition: transform 0.1s; }
        .login-btn:active { box-shadow: 0px 0px 0px #000; transform: translate(6px, 6px); }
        .user-info { text-align: center; font-size: 0.9rem; margin-bottom: 20px; }
        .logout-link { color: var(--red); text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen" style="display: none;">
    <h1 style="border: none; text-align: center; margin-bottom: 30px;">Identifikace 🕵️‍♂️</h1>
    <button class="login-btn" onclick="login('Hetik')">Hetik</button>
    <button class="login-btn" onclick="login('Fajt')">Fajt</button>
    <button class="login-btn" onclick="login('Simon')">Simon</button>
    <button class="login-btn" onclick="login('TobySS')">TobySS</button>
</div>

<div class="container" id="app-content" style="display: none;">
    <div class="user-info">
        Přihlášen jako: <span id="current-user" style="color: var(--blue); font-size: 1.1rem;"></span> | 
        <span class="logout-link" onclick="logout()">Odhlásit</span>
    </div>

    <h1>⚠️ SQUAD BASE</h1>
    
    <div class="grid">
        <a href="uklid.html" class="tile uklid">
            <div class="tile-icon">🧹</div>
            <div class="tile-title">Bordel & Úklid</div>
            <div class="status-badge">Aktivní</div>
        </a>
        
        <a href="nakupy.html" class="tile nakupy">
            <div class="tile-icon">🛒</div>
            <div class="tile-title">Co koupit</div>
            <div class="status-badge">Aktivní</div>
        </a>
        
        <a href="akce.html" class="tile akce">
            <div class="tile-icon">🍻</div>
            <div class="tile-title">Plány & Akce</div>
            <div class="status-badge">Aktivní</div>
        </a>

        <a href="#" class="tile info">
            <div class="tile-icon">📜</div>
            <div class="tile-title">Pravidla bytu</div>
            <div class="status-badge">Připravujeme</div>
        </a>
    </div>
</div>

<script>
    function checkLogin() {
        const user = localStorage.getItem('squad_user');
        if (!user) {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
        } else {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('current-user').innerText = user;
        }
    }

    function login(jmeno) {
        localStorage.setItem('squad_user', jmeno);
        checkLogin();
    }

    function logout() {
        localStorage.removeItem('squad_user');
        checkLogin();
    }

    window.onload = checkLogin;
</script>
</body>
</html>
