<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Akce</title>
    <style>
        :root { --bg: #e0e5ec; --text: #1a1a1a; --primary: #1e90ff; --accent: #2ed573; --danger: #ff4757; --border: 4px solid #000; }
        body { font-family: 'Courier New', Courier, monospace; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; font-weight: bold; }
        h1, h2, h3 { text-transform: uppercase; margin-top: 0; }
        h1 { border-bottom: var(--border); padding-bottom: 8px; font-size: 1.4rem; }
        .container { max-width: 800px; margin: 0 auto; position: relative; }
        
        .card { background: #fff; border: var(--border); padding: 15px; margin-bottom: 20px; box-shadow: 6px 6px 0px #000; }
        .card.history { background: #dcdde1; color: #555; border: 4px solid #555; box-shadow: 6px 6px 0px #555; }
        
        #form-akce { display: none; margin-bottom: 30px; background: #f1f2f6; }
        input { width: 100%; padding: 10px; border: var(--border); box-sizing: border-box; font-family: inherit; font-weight: bold; margin-bottom: 15px; font-size: 1rem; background: #fff; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        
        button { background-color: var(--primary); color: white; border: var(--border); padding: 10px 15px; font-size: 1.1rem; cursor: pointer; font-weight: bold; text-transform: uppercase; box-shadow: 4px 4px 0px #000; transition: all 0.1s; width: 100%; margin-bottom: 5px; }
        button:active { box-shadow: 0px 0px 0px #000; transform: translate(4px, 4px); }
        button.action { background-color: var(--accent); color: #000; }
        button.danger { background-color: var(--danger); }
        
        .fab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--primary); color: white; font-size: 2rem; border: var(--border); box-shadow: 4px 4px 0px #000; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; transition: transform 0.1s; }
        .fab:active { box-shadow: 0px 0px 0px #000; transform: translate(4px, 4px); }

        .akce-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .akce-title { font-size: 1.2rem; }
        .akce-date { font-size: 0.9rem; color: #555; }
        .akce-body { display: none; margin-top: 15px; border-top: 2px dashed #000; padding-top: 15px; }
        .akce-info { margin-bottom: 15px; font-size: 0.95rem; }
        
        .rsvp-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-yes { background-color: #fff; color: #000; }
        .btn-no { background-color: #fff; color: #000; }
        .btn-yes.active { background-color: var(--accent); color: #000; }
        .btn-no.active { background-color: var(--danger); color: #fff; }
        
        .ucastnici-list { font-size: 0.9rem; background: #eee; padding: 10px; border: 2px solid #000; margin-bottom: 15px; }
        .loading { text-align: center; color: #576574; font-size: 1.1rem; margin-bottom: 15px; }

        .akce-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .separator { border-top: 4px solid #000; margin: 40px 0 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="display: inline-block; margin-bottom: 15px; color: #000; text-decoration: none; border-bottom: 2px solid #000; font-size: 1.1rem;">⬅ Zpět na základnu</a>
    
    <h1>🍻 Plány & Akce</h1>
    <div id="status-zpravy" class="loading">Načítám akce... ⏳</div>

    <div class="fab" onclick="toggleForm()" id="btn-add">+</div>

    <!-- Formulář (Tvorba / Editace) -->
    <div class="card" id="form-akce">
        <h2 id="form-title">Nová akce</h2>
        <input type="hidden" id="edit-id">
        
        <label>Název akce</label>
        <input type="text" id="akce-nazev" placeholder="Např. Pivo v Lokále..." required>
        
        <label>Místo</label>
        <input type="text" id="akce-misto" placeholder="Např. Hospoda / Náš obývák..." required>
        
        <label>Datum</label>
        <input type="date" id="akce-datum" required>
        
        <label>Čas</label>
        <input type="time" id="akce-cas" required>
        
        <button id="btn-save" class="action" onclick="ulozitAkci()">Uložit akci</button>
    </div>

    <div id="seznam-akci"></div>
    
    <div class="separator"></div>
    <h2>📜 Historie (Proběhlo)</h2>
    <div id="historie-akci"></div>
</div>

<script>
    // ZDE VLOŽ SVOU NOVOU URL ADRESU Z GOOGLU!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaidXUT-Zxdh9v6fN7StqffiarMO_wFYaWVDnhOgkThKn9O5riGcn5k0HFFrBxeARX/exec"; 
    
    const loggedInUser = localStorage.getItem('squad_user');
    if (!loggedInUser) window.location.href = "index.html";

    function toggleForm() {
        const form = document.getElementById("form-akce");
        const btnAdd = document.getElementById("btn-add");
        
        if (form.style.display === "block") {
            form.style.display = "none";
            btnAdd.innerHTML = "+";
            btnAdd.style.background = "var(--primary)";
            vycistiFormular();
        } else {
            form.style.display = "block";
            btnAdd.innerHTML = "✖";
            btnAdd.style.background = "var(--danger)";
            document.getElementById('akce-datum').valueAsDate = new Date(); // Předvyplní dnešek
        }
    }

    function toggleEventDetails(id) {
        const body = document.getElementById(`akce-body-${id}`);
        body.style.display = (body.style.display === "block") ? "none" : "block";
    }

    function vycistiFormular() {
        document.getElementById("edit-id").value = "";
        document.getElementById("akce-nazev").value = "";
        document.getElementById("akce-misto").value = "";
        document.getElementById("akce-cas").value = "";
        document.getElementById("form-title").innerText = "Nová akce";
    }

    function otevriEditaci(id, nazev, misto, datum, cas) {
        document.getElementById("edit-id").value = id;
        document.getElementById("akce-nazev").value = nazev;
        document.getElementById("akce-misto").value = misto;
        // Převod zpět na formát vhodný pro input
        let dateParts = datum.split(".");
        if(dateParts.length === 3) document.getElementById("akce-datum").value = `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`;
        else document.getElementById("akce-datum").value = datum;
        
        document.getElementById("akce-cas").value = cas;
        document.getElementById("form-title").innerText = "✏️ Úprava akce";
        
        const form = document.getElementById("form-akce");
        form.style.display = "block";
        document.getElementById("btn-add").innerHTML = "✖";
        document.getElementById("btn-add").style.background = "var(--danger)";
        window.scrollTo(0, 0);
    }

    async function loadData() {
        try {
            const response = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
            const data = await response.json();
            
            const seznamAktivni = document.getElementById("seznam-akci");
            const seznamHistorie = document.getElementById("historie-akci");
            seznamAktivni.innerHTML = "";
            seznamHistorie.innerHTML = "";
            
            let aktivniCount = 0;

            if(data.akce && data.akce.length > 0) {
                data.akce.forEach(akce => {
                    let datumDily = akce.datum.split("-");
                    let hezkeDatum = datumDily.length === 3 ? `${datumDily[2]}.${datumDily[1]}.${datumDily[0]}` : akce.datum;
                    let jde = akce.ucastnici.includes(loggedInUser);
                    let isCreator = akce.vytvoril === loggedInUser;
                    
                    let card = document.createElement("div");
                    
                    if (akce.stav === "Proběhla") {
                        card.className = "card history";
                        card.innerHTML = `
                            <div class="akce-header" onclick="toggleEventDetails('${akce.id}')">
                                <div class="akce-title">❌ ${akce.nazev}</div>
                                <div class="akce-date">${hezkeDatum} 🔽</div>
                            </div>
                            <div class="akce-body" id="akce-body-${akce.id}">
                                <div class="akce-info">📍 <b>Místo:</b> ${akce.misto} | ⏰ <b>Čas:</b> ${akce.cas}</div>
                                <div class="ucastnici-list"><b>🙋‍♂️ Byli tam:</b> ${akce.ucastnici.join(", ")}</div>
                            </div>
                        `;
                        seznamHistorie.appendChild(card);
                    } else {
                        aktivniCount++;
                        card.className = "card";
                        
                        let editBtn = isCreator ? `<button onclick="otevriEditaci('${akce.id}', '${akce.nazev}', '${akce.misto}', '${hezkeDatum}', '${akce.cas}')">✏️ Upravit</button>` : "";
                        
                        card.innerHTML = `
                            <div class="akce-header" onclick="toggleEventDetails('${akce.id}')">
                                <div class="akce-title">${akce.nazev}</div>
                                <div class="akce-date">${hezkeDatum} 🔽</div>
                            </div>
                            <div class="akce-body" id="akce-body-${akce.id}">
                                <div class="akce-info">
                                    📍 <b>Místo:</b> ${akce.misto}<br>
                                    ⏰ <b>Čas:</b> ${akce.cas}<br>
                                    ✍️ <b>Vytvořil:</b> ${akce.vytvoril}
                                </div>
                                
                                <label>Jdeš na to?</label>
                                <div class="rsvp-buttons">
                                    <button class="btn-yes ${jde ? 'active' : ''}" onclick="rsvp('${akce.id}', true, this)">Jdu 🍻</button>
                                    <button class="btn-no ${!jde ? 'active' : ''}" onclick="rsvp('${akce.id}', false, this)">Nejdu ❌</button>
                                </div>
                                
                                <div class="ucastnici-list">
                                    <b>🙋‍♂️ Účastníci (${akce.ucastnici.length}):</b><br>
                                    ${akce.ucastnici.length > 0 ? akce.ucastnici.join(", ") : "Zatím nikdo..."}
                                </div>
                                
                                <div class="akce-controls">
                                    ${editBtn}
                                    <button class="action" onclick="ukoncitAkci('${akce.id}', this)">✅ Proběhlo</button>
                                </div>
                            </div>
                        `;
                        seznamAktivni.appendChild(card);
                    }
                });
            }
            
            if(aktivniCount === 0) seznamAktivni.innerHTML = "<p style='text-align:center;'>Zatím se nic neplánuje. Vytvoř něco!</p>";
            if(seznamHistorie.innerHTML === "") seznamHistorie.innerHTML = "<p style='text-align:center;'>Zatím tu žádná historie není.</p>";
            
            document.getElementById("status-zpravy").style.display = "none";
        } catch (error) {
            document.getElementById("status-zpravy").innerText = "❌ Nepodařilo se načíst akce.";
        }
    }

    async function ulozitAkci() {
        const id = document.getElementById("edit-id").value;
        const nazev = document.getElementById("akce-nazev").value;
        const misto = document.getElementById("akce-misto").value;
        const datum = document.getElementById("akce-datum").value;
        const cas = document.getElementById("akce-cas").value;

        if(!nazev || !misto || !datum || !cas) return alert("Vyplň všechna pole!");

        const btn = document.getElementById("btn-save");
        btn.innerText = "Ukládám... ⏳"; btn.disabled = true;

        let akceData = { nazev: nazev, misto: misto, datum: datum, cas: cas };
        if (id) {
            akceData.action = "edit_akce";
            akceData.id = id;
        } else {
            akceData.action = "create_akce";
            akceData.vytvoril = loggedInUser;
        }

        try {
            await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(akceData) });
            location.reload(); 
        } catch (error) { 
            alert("❌ Chyba při ukládání."); 
            btn.innerText = "Uložit akci"; btn.disabled = false; 
        }
    }

    async function ukoncitAkci(akceId, btnElement) {
        if(!confirm("Opravdu chceš akci přesunout do historie?")) return;
        
        btnElement.innerText = "⏳"; btnElement.disabled = true;
        try {
            await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "complete_akce", id: akceId }) });
            location.reload(); 
        } catch (error) { alert("❌ Chyba!"); btnElement.innerText = "✅ Proběhlo"; btnElement.disabled = false; }
    }

    async function rsvp(akceId, ucast, btnElement) {
        let buttons = btnElement.parentElement.children;
        buttons[0].classList.remove("active"); buttons[1].classList.remove("active");
        btnElement.classList.add("active"); btnElement.innerText = "⏳";
        try {
            await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "rsvp_akce", id: akceId, ucast: ucast, jmeno: loggedInUser }) });
            location.reload(); 
        } catch (error) { alert("❌ Chyba!"); }
    }

    document.addEventListener("DOMContentLoaded", loadData);
</script>
</body>
</html>
